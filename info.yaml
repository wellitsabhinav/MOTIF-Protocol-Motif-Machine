project:
  title: "MOTIF Protocol Motif Machine"
  author: "MOTIF contributors"
  description: "Configurable compound operations for serial I/O"
  language: "SystemVerilog"
  clock_hz: 50000000
  tiles: "6x4"
  top_module: "tt_um_wellitsabhinav_motif"
  source_files:
    - "motif_core.sv"
    - "motif_event_frontend.sv"
    - "motif_fifo.sv"
    - "motif_host_spi.sv"
    - "motif_pad_guardian.sv"
    - "motif_sequential_shift.sv"
    - "motif_shift_rx_count.sv"
    - "motif_shift_tx.sv"
    - "motif_timed_sample.sv"
    - "motif_watchdog.sv"
    - "tt_um_wellitsabhinav_motif.sv"
pinout:
  ui[0]: "Host SCLK"
  ui[1]: "Host CS_n"
  ui[2]: "Host MOSI"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
  uo[0]: "Host MISO"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""
  uio[0]: "Protocol pin 0 / default SPI CS_n"
  uio[1]: "Protocol pin 1 / default SPI SCLK"
  uio[2]: "Protocol pin 2 / default SPI MOSI / UART RX"
  uio[3]: "Protocol pin 3 / default SPI MISO"
  uio[4]: "Protocol pin 4"
  uio[5]: "Protocol pin 5"
  uio[6]: "Protocol pin 6"
  uio[7]: "Protocol pin 7"
yaml_version: 6
