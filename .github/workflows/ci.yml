name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Optional completed GDS run to retest after verifying unchanged physical sources
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m tools.frozen_manifest --historical
      - run: python -m tools.exchange_decomposition --check-preregistration
      - run: if [ -f experiments/exchange_decomposition/frozen_v2_manifest.json ]; then python -m tools.exchange_decomposition --check-freeze; fi
  rtl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df
        with:
          version: '2026-10-11'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -e '.[test]' -r test/requirements.txt
      - run: verilator --lint-only --top-module tt_um_wellitsabhinav_motif -Wall src/*.sv
      - run: python -m tools.rtl_check
      - run: python -m tools.formal_check
      - run: python -m tools.generalization --gate 1
      - run: python -m tools.generalization --gate 2
      - run: python -m tools.generalization --gate 1 --baseline v2
      - run: python -m tools.generalization --gate 2 --baseline v2
      - run: if [ -f experiments/exchange_decomposition/third_protocol_selection.json ]; then python -m tools.generalization --gate 3 --baseline v2; fi
      - run: python -m tools.synthesis --output-dir build/exchange_decomposition/synthesis
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: i2c-logical-traces
          path: |
            build/generalization/gate1/result.json
            build/generalization/gate1/*/*.jsonl
            build/generalization/gate2/result.json
            build/generalization/gate2/*/*.jsonl
            build/generalization/legacy/*/result.json
            build/exchange_decomposition/**/result.json
            build/exchange_decomposition/**/*.jsonl
          retention-days: 14
  cocotb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          curl -fsSL -o /tmp/motif-iverilog.deb https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y /tmp/motif-iverilog.deb
      - run: python -m pip install -r test/requirements.txt
      - run: make -C test
  gate_test:
    if: github.event_name == 'workflow_dispatch' && inputs.build_run_id != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify physical source correspondence
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .head_sha)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code "$source_sha" HEAD -- src info.yaml flow-lock.json .github/workflows/gds.yml
      - uses: actions/download-artifact@v7
        with:
          name: tt_submission
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: build/physical-artifact
      - uses: actions/upload-artifact@v7
        with:
          name: tt_submission
          path: build/physical-artifact
      - uses: TinyTapeout/tt-gds-action/gl_test@3412659307918422f3f0727917cf9b499aaca588
