[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-motif-machine"
version = "0.1.0"
description = "Executable compound-operation model for serial I/O"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["motif*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
